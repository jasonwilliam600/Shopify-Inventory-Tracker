          type: boolean
      required: [reviewed]
    Activity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [supplier_update, mismatch, review, shopify_sync]
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
      required: [id, type, title, description, createdAt]