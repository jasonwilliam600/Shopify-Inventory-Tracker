        - shopifyConnected
        - shopifyStoreName
    InventoryItem:
      type: object
      properties:
        sku:
          type: string
        mappedStoreSku:
          type: ["string", "null"]
          description: Merchant-prefix conversion candidate, not a verified store match
        skuMappingConflict:
          type: boolean
          description: Multiple original SKUs within one supplier convert to this store SKU
        productName:
          type: string
        variant:
          type: string
        category:
          type: string
        shopifyStock:
          type: integer
        supplierStock:
          type: ["integer", "null"]
        supplier:
          type: ["string", "null"]
        supplierPrice:
          type: ["number", "null"]
        supplierEta:
          type: ["string", "null"]
        supplierNotes:
          type: ["string", "null"]
        supplierUpdatedAt:
          type: ["string", "null"]
        importedFields:
          type: object
          additionalProperties: true
        supplierStatus:
          type: string
          enum: [available, low, unavailable, unknown]
        status:
          type: string
          enum: [ready, low, unavailable, mismatch, pending]
        price:
          type: number
        updatedAt:
          type: string
        reviewedAt:
          type: ["string", "null"]
        image:
          type: string
      required:
        - sku
        - productName
        - variant
        - category
        - shopifyStock
        - supplierStock
        - supplier
        - supplierPrice
        - supplierEta
        - supplierNotes
        - supplierUpdatedAt
        - importedFields
        - supplierStatus
        - status
        - price
        - updatedAt
        - reviewedAt
        - image
    InventoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [items, total, page, pageSize, totalPages]
    Supplier:
      type: object
      properties:
        name:
          type: string
        skuCount:
          type: integer
        availableCount:
          type: integer
        lastUpdate:
          type: ["string", "null"]
      required: [name, skuCount, availableCount, lastUpdate]
    SupplierUpdateRow:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        available:
          type: boolean
        quantity:
          type: integer
          minimum: 0
        productName:
          type: ["string", "null"]
        variant:
          type: ["string", "null"]
        supplierPrice:
          type: ["number", "null"]
        eta:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        raw:
          type: object
          additionalProperties: true
      required: [sku, available, quantity]
    SupplierUpdateInput:
      type: object
      properties:
        supplier:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
        columnMapping:
          type: object
          additionalProperties:
            type: string
        sourceRowCount:
          type: integer
          minimum: 0
        skippedRows:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SupplierUpdateRow"
      required: [supplier, fileName, sourceRowCount, skippedRows, rows]
    ImportResult:
      type: object
      properties:
        supplier:
          type: string
        fileName:
          type: string
        totalRows:
          type: integer
        matched:
          type: integer
        unmatched:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        unmatchedSkus:
          type: array
          items:
            type: string
        lastUpdated:
          type: string
      required: [supplier, fileName, totalRows, matched, unmatched, updated, skipped, unmatchedSkus, lastUpdated]
    InventoryReviewInput:
      type: object
      properties:
