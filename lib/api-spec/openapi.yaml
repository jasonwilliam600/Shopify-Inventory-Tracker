openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Inventory tracking API for Shopify products and wholesaler updates
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: inventory
    description: Inventory and supplier availability
  - name: dashboard
    description: Inventory overview
  - name: mapping-review
    description: Authenticated supplier relationship approval
  - name: matrixify
    description: Owner-reviewed, read-only Matrixify workbook preparation
paths:
  /reviewer/session:
    get:
      operationId: getReviewerSession
      tags: [mapping-review]
      summary: Return server-verified Clerk reviewer session and allowlist status
      responses:
        "200":
          description: Session state (including anonymous or unauthorized sessions)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewerSession"}
  /sku-mappings/approve:
    post:
      operationId: approveSkuMapping
      tags: [mapping-review]
      summary: Atomically save and approve one supplier-to-variant identity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingApprovalInput"}
      responses:
        "200":
          description: Approved mapping decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MappingDecisionResult"}
        "400": {description: Invalid or permanently held source}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
        "409": {description: Version or identity changed; review again}
  /sku-mappings/revoke:
    post:
      operationId: revokeSkuMapping
      tags: [mapping-review]
      summary: Revoke an approved source relationship
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SkuMappingRevocationInput"}
      responses:
        "200":
          description: Revoked mapping decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MappingDecisionResult"}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
        "409": {description: Version changed; review again}
  /matrixify/status:
    get:
      operationId: getMatrixifyStatus
      tags: [matrixify]
      summary: Read authorized Matrixify export prerequisites
      responses:
        "200":
          description: Actual server configuration and catalog readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixifyStatus"}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
  /matrixify/preview:
    get:
      operationId: retrieveMatrixifyPreviewPage
      tags: [matrixify]
      summary: Read a page of the existing preview
      parameters:
        - {name: previewId, in: query, required: true, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: view, in: query, schema: {type: string, enum: [changes, exceptions], default: changes}}
      responses:
        "200":
          description: The same preview DTO with the requested 100-row page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixifyPreview"}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
        "404": {description: Preview not found}
        "409": {description: Preview expired; create a fresh preview}
    post:
      operationId: createMatrixifyPreview
      tags: [matrixify]
      summary: Validate a fresh owner-supplied Matrixify Products CSV without importing it
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MatrixifyPreviewInput"}
      responses:
        "200":
          description: Paginated first page of a read-only preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatrixifyPreview"}
        "400": {description: "Invalid CSV, provenance, or confirmation"}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
  /matrixify/download:
    post:
      operationId: downloadMatrixifyWorkbook
      tags: [matrixify]
      summary: Download one profile-specific XLSX workbook for manual Matrixify import
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MatrixifyDownloadInput"}
      responses:
        "200":
          description: XLSX workbook; this endpoint never writes to Shopify
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "401": {description: Authentication required}
        "403": {description: Reviewer is not allowlisted}
        "409": {description: "Preview expired, stale, blocked, or has no changed rows"}
  /sku-mappings:
    get:
      operationId: listSkuMappingRows
      tags: [SkuMappings]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: supplier, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [all, unmatched, candidate, held, flagged, rejected, ambiguous, approved]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Read-only supplier mapping review
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkuMappingPage"}
  /sku-mappings/catalog:
    get:
      operationId: searchMappingCatalog
      tags: [SkuMappings]
      parameters:
        - {name: search, in: query, schema: {type: string, minLength: 2, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, enum: [historical, live], default: historical}}
      responses:
        "503":
          description: Live scopes/catalog are not available; no authentication or catalog request executed
        "200":
          description: Catalog preview; historical identifiers are never live variant IDs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MappingCatalogPage"}
  /sku-mappings/capabilities:
    get:
      operationId: getSkuMappingCapabilities
      tags: [SkuMappings]
      responses:
        "200":
          description: Explicit approval and live-catalog blockers
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MappingCapabilities"}
  /supplier-availability:
    get:
      operationId: listSupplierAvailability
      tags: [inventory]
      summary: Read-only historical Shopify variant supplier availability; never inventory publishing
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: issue, in: query, schema: { type: string, enum: [all, duplicate, missing], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Supplier observations, with unverified historical catalog identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierAvailabilityPage" }
        "400":
          description: Invalid query
        "503":
          description: Inventory database temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get inventory dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List inventory items
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, ready, low, unavailable, mismatch, pending]
            default: all
        - name: supplier
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Supplier-imported records only; this is not proof that a SKU is absent from Shopify.
          schema:
            type: string
            enum: [supplier]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryPage"
  /inventory-groups:
    get:
      operationId: listInventoryGroups
      tags: [inventory]
      summary: Group distributor offers by full store-format candidate SKU
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: supplier
          in: query
          description: Select groups containing this supplier; totals retain all distributors.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [all, available, unavailable, review], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Distributor stock preview, not published Shopify inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryGroupPage" }
        "400":
          description: Invalid query
  /inventory-groups/{groupKey}:
    get:
      operationId: getInventoryGroup
      tags: [inventory]
      summary: Get all distributor offers for an inventory group
      parameters:
        - name: groupKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Group detail with publishing prerequisites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryGroupDetail" }
        "404":
          description: Group not found
  /inventory/{sku}:
    get:
      operationId: getInventoryItem
      tags: [inventory]
      summary: Get one inventory item by SKU
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Inventory item not found
  /inventory/{sku}/review:
    patch:
      operationId: reviewInventoryItem
      tags: [inventory]
      summary: Mark an inventory item as reviewed
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryReviewInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Inventory item not found
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [inventory]
      summary: List suppliers
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
  /supplier-updates:
    post:
      operationId: importSupplierUpdate
      tags: [inventory]
      summary: Import wholesaler availability rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdateInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /supplier-updates/hobbytyme/refresh:
    post:
      operationId: refreshHobbyTymeInventory
      tags: [inventory]
      summary: Download and import the newest HobbyTyme inventory export
      responses:
        "201":
          description: HobbyTyme import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "502":
          description: HobbyTyme export could not be fetched or parsed
  /supplier-updates/heartland/refresh:
    post:
      operationId: refreshHeartlandInventory
      tags: [inventory]
      summary: Download Heartland inventory without replacing other suppliers
      responses:
        "201":
          description: Heartland import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "502":
          description: Heartland export could not be fetched or parsed
  /supplier-updates/walthers/refresh:
    post:
      operationId: refreshWalthersInventory
      tags: [inventory]
      summary: Start a background Walthers dealer inventory refresh
      responses:
        "202":
          description: Walthers import started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalthersRefreshStatus"
  /supplier-updates/walthers/status:
    get:
      operationId: getWalthersRefreshStatus
      tags: [inventory]
      summary: Get progress or the result of the Walthers refresh
      responses:
        "200":
          description: Current Walthers refresh state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalthersRefreshStatus"
  /supplier-updates/mmd/refresh:
    post:
      operationId: refreshMmdInventory
      tags: [inventory]
      summary: Start an independent MMD/Squadron dealer inventory refresh
      responses:
        "202":
          description: MMD import started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MmdRefreshStatus"
  /supplier-updates/mmd/status:
    get:
      operationId: getMmdRefreshStatus
      tags: [inventory]
      summary: Get MMD/Squadron refresh progress and result
      responses:
        "200":
          description: Current MMD refresh state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MmdRefreshStatus"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent inventory activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  schemas:
    SkuMappingRow:
      type: object
      required: [supplier, originalSku, suggestedSkus, diagnosticSkus, supplierQuantity, quantityText, quantityKind, availability, freshness, lastFeedImport, mappingStatus, reason, supplierProductName, shopifyTitles, trusted, publishable, ruleDecision, warnings]
      properties:
        supplier: {type: string}
        originalSku: {type: string}
        suggestedSkus: {type: array, items: {type: string}}
        diagnosticSkus: {type: array, items: {type: string}}
        supplierQuantity: {type: [number, "null"]}
        quantityText: {type: [string, "null"]}
        quantityKind: {type: string}
        availability: {type: string}
        freshness: {type: string}
        lastFeedImport: {type: [string, "null"]}
        mappingStatus: {type: string, enum: [unmatched, candidate, held, flagged, rejected, ambiguous, approved]}
        reason: {type: string}
        supplierProductName: {type: [string, "null"]}
        shopifyTitles: {type: array, items: {type: string}}
        trusted: {type: boolean}
        publishable: {type: boolean}
        ruleDecision: {type: [string, "null"]}
        warnings: {type: array, items: {type: string}}
        decisionId: {type: [string, "null"]}
        decisionVersion: {type: [integer, "null"]}
        approvedVariantId: {type: [string, "null"]}
        identityFingerprint: {type: [string, "null"]}
        costAmount: {type: [string, "null"]}
        sourceIdentityFingerprint: {type: [string, "null"]}
    SkuMappingPage:
      type: object
      required: [items, total, page, pageSize, totalPages, catalogLabel, counts]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SkuMappingRow"}}
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
        totalPages: {type: integer}
        catalogLabel: {type: string}
        counts: {type: object, additionalProperties: {type: integer}}
    MappingCatalogVariant:
      type: object
      required: [key, variantId, sku, title, vendor, options, skuStatus, historical]
      properties:
        key: {type: string}
        variantId: {type: [string, "null"]}
        sku: {type: string}
        title: {type: string}
        vendor: {type: string}
        options: {type: array, items: {type: string}}
        skuStatus: {type: string}
        historical: {type: boolean}
        productId: {type: [string, "null"]}
        inventoryItemId: {type: [string, "null"]}
        productTitle: {type: string}
        variantTitle: {type: string}
        productStatus: {type: string, enum: [ACTIVE, DRAFT, ARCHIVED]}
        verifiedAt: {type: [string, "null"]}
        identityFingerprint: {type: [string, "null"]}
    MappingCatalogPage:
      type: object
      required: [items, total, source, verified, blocker]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/MappingCatalogVariant"}}
        total: {type: integer}
        source: {type: string}
        verified: {type: boolean}
        blocker: {type: [string, "null"]}
    MappingCapabilities:
      type: object
      required: [canSave, canApprove, liveCatalogAvailable, scopesVerified, grantedScopes, blockers]
      properties:
        canSave: {type: boolean}
        canApprove: {type: boolean}
        liveCatalogAvailable: {type: boolean}
        scopesVerified: {type: boolean}
        grantedScopes: {type: array, items: {type: string}}
        blockers: {type: array, items: {type: string}}
    ReviewerSession:
      type: object
      required: [configured, authenticated, authorized, subject, issuer, message]
      properties:
        configured: {type: boolean}
        authenticated: {type: boolean}
        authorized: {type: boolean}
        subject: {type: [string, "null"]}
        issuer: {type: [string, "null"]}
        message: {type: string}
    MappingDecisionResult:
      type: object
      required: [id, version, state]
      properties:
        id: {type: string}
        version: {type: integer}
        state: {type: string}
    SkuMappingApprovalInput:
      type: object
      additionalProperties: false
      required: [supplier, originalSku, variantId, expectedVersion, identityFingerprint, sourceIdentityFingerprint, identityConfirmed, unitConfirmed, reason, costConfirmed, costBasis, packSize, costEvidence]
      properties:
        supplier: {type: string, enum: ["Heartland Hobby Wholesale", HobbyTyme, Walthers, "MMD/Squadron"]}
        originalSku: {type: string, minLength: 1, maxLength: 300}
        variantId: {type: string, pattern: "^gid://shopify/ProductVariant/[1-9][0-9]*$"}
        expectedVersion: {type: [integer, "null"], minimum: 1}
        expectedCostAmount:
          type: [string, "null"]
          default: null
          description: Exact supplier cost string displayed in the review; send unchanged to reject a changed source cost.
        identityFingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        identityConfirmed: {type: boolean, const: true}
        sourceIdentityFingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
        unitConfirmed: {type: boolean, const: true}
        reason: {type: string, minLength: 12, maxLength: 2000}
        costConfirmed: {type: boolean, default: false}
        costBasis: {type: string, enum: [piece, pack, unknown], default: unknown}
        packSize: {type: [integer, "null"], minimum: 1, maximum: 100000, default: null}
        costEvidence: {type: string, maxLength: 2000, default: ""}
    SkuMappingRevocationInput:
      type: object
      additionalProperties: false
      required: [supplier, originalSku, expectedVersion, reason]
      properties:
        supplier: {type: string, enum: ["Heartland Hobby Wholesale", HobbyTyme, Walthers, "MMD/Squadron"]}
        originalSku: {type: string, minLength: 1, maxLength: 300}
        expectedVersion: {type: integer, minimum: 1}
        reason: {type: string, minLength: 12, maxLength: 2000}
    MatrixifyStatus:
      type: object
      required: [catalogCount, catalogReady, policyReady, pricingApproved, metafieldsReady, locationName, blockers, shopDomain, policySummary]
      properties:
        catalogCount: {type: integer}
        catalogReady: {type: boolean}
        policyReady: {type: boolean}
        pricingApproved: {type: boolean}
        metafieldsReady: {type: boolean}
        locationName: {type: [string, "null"]}
        blockers: {type: array, items: {type: string}}
        shopDomain: {type: string}
        policySummary: {type: string}
    MatrixifyPreviewInput:
      type: object
      additionalProperties: false
      required: [baselineCsv, baselineObservedAt, baselineConfirmed]
      properties:
        baselineCsv: {type: string, minLength: 1, maxLength: 20000000}
        baselineObservedAt: {type: string, format: date-time}
        baselineConfirmed: {type: boolean, const: true}
        variantIds:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          description: Optional owner-selected subset of full ProductVariant GIDs; baseline validation remains full-catalog.
          items:
            type: string
            pattern: "^gid://shopify/ProductVariant/[1-9][0-9]*$"
    MatrixifyDownloadInput:
      type: object
      additionalProperties: false
      required: [previewId, digest, profile]
      properties:
        previewId: {type: string, format: uuid}
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        profile: {type: string, enum: [inventory, supplier_metafields, prices]}
    MatrixifyPreviewRow:
      type: object
      required: [variantId, sku, title, beforeQuantity, afterQuantity, beforePrice, afterPrice, supplierSummary]
      properties:
        variantId: {type: string}
        sku: {type: string}
        title: {type: string}
        beforeQuantity: {type: [number, "null"], description: Null means unknown and must never be represented as zero.}
        afterQuantity: {type: [number, "null"]}
        beforePrice: {type: [string, "null"]}
        afterPrice: {type: [string, "null"]}
        supplierSummary: {type: array, items: {type: string}}
    MatrixifyPreviewException:
      type: object
      required: [variantId, code, supplier, originalSku]
      properties:
        variantId: {type: string}
        code: {type: string}
        supplier: {type: [string, "null"]}
        originalSku: {type: [string, "null"]}
    MatrixifyPreviewCounts:
      type: object
      required: [variants, inventoryRows, metafieldRows, priceRows, exceptions]
      properties:
        variants: {type: integer}
        inventoryRows: {type: integer}
        metafieldRows: {type: integer}
        priceRows: {type: integer}
        exceptions: {type: integer}
    MatrixifyPreview:
      type: object
      required: [id, digest, expiresAt, shopDomain, locationName, blockers, counts, page, totalPages, totalRows, rows, exceptions, warnings]
      properties:
        id: {type: string}
        digest: {type: string}
        expiresAt: {type: string, format: date-time}
        shopDomain: {type: string}
        locationName: {type: [string, "null"]}
        blockers: {type: array, items: {type: string}}
        counts: {$ref: "#/components/schemas/MatrixifyPreviewCounts"}
        page: {type: integer}
        totalPages: {type: integer}
        totalRows: {type: integer}
        rows: {type: array, items: {$ref: "#/components/schemas/MatrixifyPreviewRow"}}
        exceptions: {type: array, items: {$ref: "#/components/schemas/MatrixifyPreviewException"}}
        warnings: {type: array, items: {type: string}}
    SupplierAvailabilityOffer:
      type: object
      required: [sourceSku, mappingStatus, mappingReason, matchMethod, reportedQuantity, quantityKind, quantityText, availability, freshness, lastFeedImport, freshnessLimitMinutes, stockReason, trusted, publishable]
      properties:
        sourceSku: { type: string }
        mappingStatus: { type: string, enum: [candidate, held, rejected, collision] }
        mappingReason: { type: string }
        matchMethod: { type: string, enum: [exact_identifier, prefix, exact_sku] }
        reportedQuantity: { type: [integer, "null"] }
        quantityKind: { type: string, enum: [exact, lower_bound, upper_bound, unknown] }
        quantityText: { type: string }
        availability: { type: string, enum: [available, out_of_stock, unknown] }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        lastFeedImport: { type: [string, "null"], format: date-time }
        freshnessLimitMinutes: { type: integer }
        stockReason: { type: string }
        trusted: { type: boolean }
        publishable: { type: boolean }
    SupplierAvailabilitySupplier:
      type: object
      required: [supplier, offers]
      properties:
        supplier: { type: string }
        offers:
          type: array
          items: { $ref: "#/components/schemas/SupplierAvailabilityOffer" }
    SupplierAvailabilityVariant:
      type: object
      required: [key, variantId, sku, title, handle, options, skuStatus, suppliers]
      properties:
        key: { type: string }
        variantId: { type: [string, "null"] }
        sku: { type: string }
        title: { type: string }
        handle: { type: string }
        options: { type: array, items: { type: string } }
        skuStatus: { type: string, enum: [unique, duplicate, missing] }
        suppliers:
          type: array
          items: { $ref: "#/components/schemas/SupplierAvailabilitySupplier" }
    SupplierAvailabilityCatalog:
      type: object
      required: [source, observedAt, verified, containsVariantIds, totalVariants, duplicateSkuGroups, missingSkuVariants, blocker, rejectedMappings, flaggedCandidates, uniqueHeldSources, publishingEnabled, physicalStockExists]
      properties:
        source: { type: string, enum: [historical, unavailable] }
        observedAt: { type: [string, "null"], format: date-time }
        verified: { type: boolean }
        containsVariantIds: { type: boolean }
        totalVariants: { type: integer }
        duplicateSkuGroups: { type: integer }
        missingSkuVariants: { type: integer }
        blocker: { type: string }
        rejectedMappings: { type: integer }
        flaggedCandidates: { type: integer }
        uniqueHeldSources: { type: integer }
        publishingEnabled: { type: boolean }
        physicalStockExists: { type: boolean }
    SupplierAvailabilityPage:
      type: object
      required: [items, total, page, pageSize, totalPages, catalog]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SupplierAvailabilityVariant" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        catalog: { $ref: "#/components/schemas/SupplierAvailabilityCatalog" }
    MmdRefreshStatus:
      type: object
      required: [state, startedAt, fetchedRows, totalRows, result, error]
      properties:
        state:
          type: string
          enum: [idle, running, complete, failed]
        startedAt:
          type: ["string", "null"]
          format: date-time
        fetchedRows: { type: integer }
        totalRows: { type: integer }
        error: { type: ["string", "null"] }
        warning: { type: ["string", "null"] }
        result:
          anyOf:
            - $ref: "#/components/schemas/ImportResult"
            - type: "null"
    WalthersRefreshStatus:
      type: object
      required: [state, startedAt, fetchedRows, totalRows, result, error]
      properties:
        state:
          type: string
          enum: [idle, running, complete, failed]
        startedAt:
          type: ["string", "null"]
          format: date-time
        fetchedRows: { type: integer }
        totalRows: { type: integer }
        error: { type: ["string", "null"] }
        warning: { type: ["string", "null"] }
        result:
          anyOf:
            - $ref: "#/components/schemas/ImportResult"
            - type: "null"
    DistributorStock:
      type: object
      required: [supplier, sourceSku, locationName, shopifyLocationId, reportedQuantity, countedQuantity, supplierStatus, supplierUpdatedAt, wholesalePrice, mappingConflict, boundedQuantity]
      properties:
        supplier: { type: string }
        sourceSku: { type: string }
        manufacturerName: { type: ["string", "null"] }
        locationName:
          type: string
          description: Proposed distributor location label, not an assigned Shopify location.
        shopifyLocationId: { type: ["string", "null"] }
        reportedQuantity: { type: ["integer", "null"] }
        countedQuantity: { type: ["integer", "null"] }
        supplierStatus: { type: string }
        supplierUpdatedAt: { type: ["string", "null"], format: date-time }
        wholesalePrice: { type: ["number", "null"] }
        mappingConflict: { type: boolean }
        boundedQuantity:
          type: boolean
          description: Quantity is a lower bound from the feed, not an exact count.
    InventoryGroup:
      type: object
      required: [groupKey, sku, mappedStoreSku, productName, variant, mappingState, status, distributorTotal, knownSubtotal, shopifySellableStock, boundedQuantity, distributors, missingSuppliers]
      properties:
        groupKey: { type: string }
        sku: { type: string }
        mappedStoreSku: { type: ["string", "null"] }
        productName: { type: string }
        variant: { type: string }
        mappingState: { type: string, enum: [candidate, unmapped, conflict] }
        status: { type: string, enum: [available, unavailable, review] }
        distributorTotal:
          type: ["integer", "null"]
          description: Feed availability preview; null when any offer has unknown quantity or a same-supplier collision.
        knownSubtotal: { type: integer }
        shopifySellableStock:
          type: ["integer", "null"]
          description: Actual verified Shopify quantity; unavailable while disconnected.
        boundedQuantity: { type: boolean }
        distributors:
          type: array
          items: { $ref: "#/components/schemas/DistributorStock" }
        missingSuppliers:
          type: array
          description: Distributors with no matching imported record, not confirmed zero stock.
          items: { type: string }
    InventoryPublishingState:
      type: object
      required: [shopifyConnected, publishingEnabled, blockingReason, prerequisites]
      properties:
        shopifyConnected: { type: boolean }
        publishingEnabled: { type: boolean }
        blockingReason: { type: ["string", "null"] }
        prerequisites:
          type: array
          items: { type: string }
    InventoryGroupPage:
      type: object
      required: [items, total, page, pageSize, totalPages, suppliers, publishing]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryGroup" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        suppliers:
          type: array
          items: { type: string }
        publishing: { $ref: "#/components/schemas/InventoryPublishingState" }
    InventoryGroupDetail:
      type: object
      required: [item, publishing]
      properties:
